name: Desplegar web al hosting

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Probar conexion al servidor FTP
        run: |
          timeout 20 bash -c 'echo > /dev/tcp/${{ secrets.SFTP_HOST }}/21' && echo "CONEXION OK: puerto 21 abierto" || { echo "FALLO: no se puede conectar al puerto 21"; exit 1; }

      - name: Subir archivos por FTP a PiensaSolutions
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 21
          protocol: ftp
          server-dir: /html/
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
